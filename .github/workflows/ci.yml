name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The desktop frontend needs a windowing stack; the core, the addons and
      # the web server do not, so CI builds what it can check rather than
      # pulling in a display server to compile a binary it never runs.
      - name: Build
        run: cargo build --locked -p tinybird-core -p tinybird-addons -p tinybird-games -p tinybird-web -p tinybird-runtime

      - name: Unit tests
        run: cargo test --locked -p tinybird-core -p tinybird-addons -p tinybird-games -p tinybird-web -p tinybird-runtime

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release hygiene and the local server
        run: |
          python scripts/check-release.py
          python tests/server_smoke.py target/debug/tinybird-web
          python examples/python/test_tinybird.py

      - name: Optional training environment contract
        run: |
          python -m pip install "gymnasium>=1.0,<2"
          python examples/python/test_training.py

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, unlike the other jobs. A new stable release brings new lints,
      # and a gate that starts failing on a commit that changed nothing teaches
      # people to ignore it. Raise this deliberately, with the fixes it asks for.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # A gate. What is deliberately allowed is listed once, with reasons, under
      # `[workspace.lints.clippy]` in Cargo.toml. The desktop frontend is left
      # out for the same reason it is not built above: it needs a windowing and
      # audio stack this runner does not have. Lint it locally with
      # `cargo clippy --workspace --all-targets -- -D warnings`.
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude tinybird-desktop --all-targets -- -D warnings

      - name: Clippy (WebAssembly)
        run: cargo clippy --locked -p tinybird-wasm --target wasm32-unknown-unknown -- -D warnings

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      # Checks Cargo.lock against the RustSec advisory database.
      - name: cargo audit
        run: cargo audit

  accuracy:
    name: Accuracy (GBA test ROMs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Fetch test ROMs
        # Through `bash` rather than by path: the script is committed from
        # Windows without its executable bit, and running it directly failed
        # this job with exit 126 on every push.
        run: bash scripts/fetch-test-roms.sh

      # A gate. Every ROM in the suite passes, so a failure here is a
      # regression rather than a known gap.
      - name: Run the accuracy suite
        run: cargo test -p tinybird-core --test accuracy -- --nocapture --test-threads=1

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Build the emulator module
        run: cargo build -p tinybird-wasm --target wasm32-unknown-unknown --release

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The browser-side modules that carry real logic and no DOM. This runs
      # after the module is built because one of them needs it: the link cable
      # tests load two copies of the emulator and cable them together, which is
      # the closest thing to two players that fits in a test.
      - name: Browser module tests
        run: node --test crates/tinybird-web/src/assets/*.test.mjs
