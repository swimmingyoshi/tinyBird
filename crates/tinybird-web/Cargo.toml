[package]
name = "tinybird-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Local web server for the tinyBird browser player, add-on tools and overlay"

[[bin]]
name = "tinybird-web"
path = "src/main.rs"

[dependencies]
tinybird-addons.workspace = true
axum.workspace = true
serde_json.workspace = true
# Fetches species sprites once and caches them on disk; see sprites.rs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
