[workspace]
resolver = "2"
members = [
    "crates/tinybird-addons",
    "crates/tinybird-core",
    "crates/tinybird-desktop",
    "crates/tinybird-games",
    "crates/tinybird-probe",
    "crates/tinybird-wasm",
    "crates/tinybird-web",
]
default-members = ["crates/tinybird-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["tinyBird Team"]

[profile.dev]
opt-level = 2

# Kept for size, not for speed.
#
# This was added to see whether cross-crate inlining would buy frames in the
# browser build, where one emulated frame has 16.74ms to happen in and takes
# about 14.5. It did not: frame time was unchanged inside measurement noise, so
# the cost is in the interpreter itself and not in what the linker can see.
#
# What it does buy is a wasm module about 14% smaller (610KB to 523KB), which
# is worth having on a page someone loads over a network. The trade is a
# release build that takes roughly ten times as long; dev builds are untouched.
#
# `panic = "abort"` is deliberately *not* set here: it would break
# `cargo test --release`, which is how `tests/link_trade.rs` is meant to run.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
# Internal crates
tinybird-addons = { path = "crates/tinybird-addons" }
tinybird-core = { path = "crates/tinybird-core" }
tinybird-games = { path = "crates/tinybird-games" }
tinybird-wasm = { path = "crates/tinybird-wasm" }

# External dependencies (common)
bitflags = "2.4"
thiserror = "1.0"
winit = "0.30"
softbuffer = "0.4"
cpal = "0.15"
gilrs = "0.11"
rfd = "0.15"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
axum = "0.8"
tokio = "1.48"
