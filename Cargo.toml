[workspace]
resolver = "2"
members = [
    "crates/tinybird-core",
    "crates/tinybird-desktop",
    "crates/tinybird-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["tinyBird Team"]

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[workspace.dependencies]
# Internal crates
tinybird-core = { path = "crates/tinybird-core" }

# External dependencies (common)
bitflags = "2.4"
thiserror = "1.0"
winit = "0.30"
softbuffer = "0.4"
cpal = "0.15"
gilrs = "0.11"
rfd = "0.15"
pollster = "0.4"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
axum = "0.8"
tokio = "1.48"
